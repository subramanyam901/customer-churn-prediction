{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-light: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.1), 0px 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        .sidebar { width: 280px; background: var(--sidebar-bg); height: 100vh; padding: 30px 20px; position: fixed; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-links { list-style: none; margin-top: 40px; }
        .nav-links li { margin-bottom: 8px; }
        .nav-links a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; text-decoration: none; color: var(--text-muted); font-weight: 500; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { background: var(--accent-light); color: white; }
        .nav-links a i { color: var(--accent); width: 20px; text-align: center; }

        .main-content { flex: 1; margin-left: 280px; padding: 40px; width: calc(100% - 280px); }
        .card-admin { background: var(--card-bg); border-radius: var(--radius-lg); padding: 30px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.05); }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .badge { padding: 4px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-waiting { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .btn-activa { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-activa:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2 style="font-size: 20px; display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i> Admin Auth</h2>
        <ul class="nav-links">
            <li><a href="{% url 'AdminHome' %}" class="{% block admin_home %}{% endblock %}"><i class="fa-solid fa-grid-2"></i> Dashboard</a></li>
            <li><a href="{% url 'ViewRegisteredUsers' %}" class="{% block user_list %}{% endblock %}"><i class="fa-solid fa-users-gear"></i> User Details</a></li>
            <li style="margin-top: auto;"><a href="{% url 'index' %}" style="color: var(--danger);"><i class="fa-solid fa-power-off"></i> Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
