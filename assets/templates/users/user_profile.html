{% extends 'users/UserHome.html' %}
{% block content %}
<style>
    .profile-card { background: white; border-radius: 24px; padding: 40px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
    .profile-header { text-align: center; margin-bottom: 30px; }
    .profile-img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 4px solid var(--accent-light); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .form-group input { width: 100%; border: 1px solid #f4f7fe; background: var(--primary-bg); padding: 12px 16px; border-radius: 12px; font-size: 14px; color: #1e293b; outline: none; }
    .btn-update { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    .btn-update:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2); }
</style>

<div class="profile-card">
    <div class="profile-header">
        <img class="profile-img" src="https://ui-avatars.com/api/?name={{ user.name }}&background=4318ff&color=fff" alt="Avatar">
        <h2>Account Settings</h2>
        <p style="color: var(--text-muted);">Update your analytical credentials</p>
    </div>

    <form action="{% url 'UserProfile' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Login ID / Username</label>
            <input type="text" value="{{ user.loginid }}" disabled style="background: #f8fafc; color: #94a3b8;">
        </div>
        <div class="form-group">
            <label>Your Full Name</label>
            <input type="text" name="name" value="{{ user.name }}" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" value="{{ user.email }}" required>
        </div>
        <div class="form-group">
            <label>Update Password (Leave blank to keep current)</label>
            <input type="password" name="password" placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn-update"><i class="fa fa-save"></i> Save Profile Changes</button>
    </form>
</div>
{% endblock %}
